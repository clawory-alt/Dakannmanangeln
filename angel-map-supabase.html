<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Angel Map Deutschland</title>
<style>
:root{--bg:#f3f6f4;--ink:#13302f;--mut:#5b7270;--line:#d3dedb;--pan:#fff;--acc:#0f6b66;--acc2:#e8f2f0;--warn:#a5521a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1b1b;--ink:#e3efec;--mut:#8fa8a5;--line:#27403e;--pan:#152726;--acc:#4cc2b8;--acc2:#1b3533;--warn:#e0905a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);height:100vh;display:grid;grid-template-columns:1fr 400px}
#map{height:100%;background:var(--acc2)}
aside{background:var(--pan);border-left:1px solid var(--line);overflow:auto;padding:20px}
h1{font-size:1.5rem;margin:0 0 4px}h2{font-size:1.2rem;margin:0 0 4px}h3{font-size:1rem;margin:20px 0 8px}
p{margin:4px 0}.mut{color:var(--mut);font-size:.9rem}
.sp{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:8px 0}
.badge{display:inline-block;font:600 .78rem system-ui,sans-serif;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-left:6px}
.badge.nat{background:transparent;border:1px solid var(--line);color:var(--mut)}
.badge.w{background:transparent;border:1px solid var(--warn);color:var(--warn)}
form{display:grid;gap:8px;margin-top:8px}
select,input,button{font:inherit;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{background:var(--acc);color:var(--bg);border:0;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.list button{display:block;width:100%;text-align:left;margin:6px 0;background:var(--acc2);color:var(--ink);font-weight:400}
.note{background:var(--acc2);padding:10px;border-radius:6px;font-size:.9rem;margin:12px 0}
.err{color:var(--warn);font-size:.9rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.bar button{padding:6px 10px}
@media (max-width:800px){body{grid-template-columns:1fr;grid-template-rows:45vh 1fr;height:auto}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div id="map" role="application" aria-label="Karte der Gewässer"></div>
<aside id="panel" aria-live="polite"></aside>

<script>
/* ============ KONFIGURATION: HIER DEINE KEYS EINTRAGEN ============ */
const GMAPS_KEY = "AIzaSyDOtFUnfisnyQ4aGCqYkLBn-2Qho8wYjRg";          // Google Maps JavaScript API Key
const SUPABASE_URL = "";       // z. B. https://abcdxyz.supabase.co
const SUPABASE_ANON_KEY = "";  // der "anon public" Key (niemals den service_role Key!)

const sb = (SUPABASE_URL && SUPABASE_ANON_KEY) ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let user = null;

/* ============ STAMMDATEN ============ */
const SPECIES = {hecht:"Hecht",barsch:"Flussbarsch",zander:"Zander",karpfen:"Karpfen",schleie:"Schleie",aal:"Aal",wels:"Wels",
 rotauge:"Rotauge",brachse:"Brachse",rotfeder:"Rotfeder",renke:"Renke (Felchen)",seeforelle:"Seeforelle",saibling:"Seesaibling",
 bachforelle:"Bachforelle",regenbogen:"Regenbogenforelle",aesche:"Äsche",huchen:"Huchen",barbe:"Barbe",doebel:"Döbel",
 rapfen:"Rapfen",graskarpfen:"Graskarpfen",quappe:"Quappe",kaulbarsch:"Kaulbarsch"};
const LAKES = [
 {id:"starnberg",name:"Starnberger See",lat:47.9,lng:11.32,base:["hecht","barsch","zander","renke","seeforelle","saibling","aal","karpfen","schleie","rotauge","brachse","quappe"]},
 {id:"ammersee",name:"Ammersee",lat:48.0,lng:11.12,base:["hecht","barsch","zander","renke","aal","karpfen","schleie","rotauge","brachse","wels"]},
 {id:"chiemsee",name:"Chiemsee",lat:47.88,lng:12.45,base:["hecht","barsch","zander","renke","seeforelle","saibling","aal","karpfen","rotauge","brachse","quappe"]},
 {id:"bodensee",name:"Bodensee",lat:47.59,lng:9.36,base:["hecht","barsch","zander","renke","seeforelle","aal","karpfen","rotauge","brachse","wels","quappe"]},
 {id:"mueritz",name:"Müritz",lat:53.4,lng:12.7,base:["hecht","barsch","zander","aal","karpfen","schleie","rotauge","brachse","wels","kaulbarsch"]},
 {id:"edersee",name:"Edersee",lat:51.18,lng:9.05,base:["hecht","barsch","zander","aal","karpfen","rotauge","brachse","wels","regenbogen"]},
 {id:"steinhude",name:"Steinhuder Meer",lat:52.48,lng:9.35,base:["hecht","barsch","zander","aal","karpfen","schleie","rotauge","brachse","wels"]},
 {id:"isar",name:"Isar bei München",lat:48.1,lng:11.55,base:["bachforelle","aesche","huchen","barbe","doebel","rapfen","hecht","regenbogen"]}
];

/* ============ AGGREGATION ============ */
function aggregate(lake, catches, reports){
  const out = {}, ids = new Set(lake.base);
  catches.forEach(c=>ids.add(c.species));
  reports.filter(r=>r.type==="besatz").forEach(r=>ids.add(r.species));
  ids.forEach(sp=>{
    const cs = catches.filter(c=>c.species===sp), lures = {};
    cs.forEach(c=>{if(c.lure){const k=c.lure.trim().toLowerCase();lures[k]=(lures[k]||0)+1}});
    const top = Object.entries(lures).sort((a,b)=>b[1]-a[1])[0], n = cs.length;
    out[sp] = {count:n, native:lake.base.includes(sp),
      last:n? cs.map(c=>c.created_at).sort().pop() : null,
      topLure: top?{name:top[0],share:Math.round(top[1]/n*100)}:null,
      stocked:reports.some(r=>r.type==="besatz"&&r.species===sp),
      gone:reports.filter(r=>r.type==="weg"&&r.species===sp).length};
  });
  return out;
}
function status(a){
  if(a.count>0) return a.native?"Aktiv / Bestätigt":"Community-bestätigt";
  if(a.native) return "Vorkommen heimisch";
  if(a.stocked) return "Besatz gemeldet";
  return "Unbestätigt";
}
const freq = n=>n>=10?"sehr häufig":n>=4?"häufig":"selten";
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = iso=>new Date(iso).toLocaleDateString("de-DE");

/* ============ AUTH ============ */
const panel = document.getElementById("panel");
let currentLake = null;

function authBar(){
  if(!sb) return `<div class="note">Supabase ist noch nicht verbunden. Trage <code>SUPABASE_URL</code> und <code>SUPABASE_ANON_KEY</code> im Code ein.</div>`;
  if(user) return `<div class="bar"><span class="mut">Angemeldet als ${esc(user.email)}</span><button class="ghost" id="logout">Abmelden</button></div>`;
  return `<form id="authForm" class="bar" style="display:grid">
    <input name="email" type="email" placeholder="E-Mail" required autocomplete="email">
    <input name="password" type="password" placeholder="Passwort (mind. 6 Zeichen)" minlength="6" required autocomplete="current-password">
    <div style="display:flex;gap:8px"><button style="flex:1" data-act="login">Anmelden</button><button class="ghost" style="flex:1" data-act="signup">Registrieren</button></div>
    <p class="err" id="authErr"></p></form>`;
}
function bindAuth(){
  const lo = document.getElementById("logout");
  if(lo) lo.onclick = async()=>{await sb.auth.signOut()};
  const f = document.getElementById("authForm");
  if(f) f.onsubmit = async e=>{
    e.preventDefault();
    const act = e.submitter ? e.submitter.dataset.act : "login";
    const email = f.email.value, password = f.password.value;
    const {error,data} = act==="signup" ? await sb.auth.signUp({email,password}) : await sb.auth.signInWithPassword({email,password});
    const el = document.getElementById("authErr");
    if(error) el.textContent = error.message;
    else if(act==="signup" && !data.session) el.textContent = "Fast fertig: Bestätige deine E-Mail-Adresse über den Link in deinem Postfach.";
  };
}
if(sb){
  sb.auth.getSession().then(({data})=>{user=data.session?data.session.user:null;render()});
  sb.auth.onAuthStateChange((_e,session)=>{user=session?session.user:null;render()});
}

/* ============ ANZEIGE ============ */
function render(){ currentLake ? select(currentLake) : home(); }

function home(){
  currentLake = null;
  panel.innerHTML = `${authBar()}<h1>Angel Map Deutschland</h1>
   <p class="mut">Wähle ein Gewässer auf der Karte oder in der Liste und sieh, was die Community dort fängt.</p>
   ${GMAPS_KEY?"":`<div class="note">Noch kein Google-Maps-Key eingetragen (<code>GMAPS_KEY</code>). Bis dahin funktioniert die Gewässerliste.</div>`}
   <div class="list">${LAKES.map(l=>`<button data-id="${l.id}">${esc(l.name)}</button>`).join("")}</div>`;
  panel.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>select(b.dataset.id));
  bindAuth();
}

async function select(id){
  currentLake = id;
  const lake = LAKES.find(l=>l.id===id);
  if(window.map){map.panTo({lat:lake.lat,lng:lake.lng});map.setZoom(11)}
  let catches=[], reports=[], loadErr="";
  if(sb){
    const [c,r] = await Promise.all([
      sb.from("catches").select("species,lure,created_at").eq("lake",id),
      sb.from("reports").select("species,type").eq("lake",id)]);
    if(c.error||r.error) loadErr = (c.error||r.error).message;
    catches = c.data||[]; reports = r.data||[];
  }
  if(currentLake!==id) return;
  const agg = aggregate(lake,catches,reports);
  const rows = Object.entries(agg).sort((a,b)=>b[1].count-a[1].count||SPECIES[a[0]].localeCompare(SPECIES[b[0]]));
  const opts = Object.entries(SPECIES).sort((a,b)=>a[1].localeCompare(b[1])).map(([k,v])=>`<option value="${k}">${esc(v)}</option>`).join("");
  panel.innerHTML = `${authBar()}<button class="ghost" id="back">Zurück zur Übersicht</button>
   <h2 style="margin-top:14px">${esc(lake.name)}</h2>
   <p class="mut">${catches.length} gemeldete Fänge, ${rows.length} Fischarten</p>
   ${loadErr?`<p class="err">Daten konnten nicht geladen werden: ${esc(loadErr)}</p>`:""}
   <h3>Fischarten</h3>
   ${rows.map(([sp,a])=>`<div class="sp"><b>${esc(SPECIES[sp])}</b><span class="badge">${status(a)}</span>
     ${a.stocked&&a.count>0?'<span class="badge nat">Besatz</span>':""}${a.gone?`<span class="badge w">${a.gone}× als verschwunden gemeldet</span>`:""}
     ${a.count>0?`<p class="mut">${freq(a.count)} (${a.count} Fänge), letzter Fang ${fmt(a.last)}${a.topLure?`, Top-Köder: ${esc(a.topLure.name)} (${a.topLure.share} %)`:""}</p>`
     :`<p class="mut">Noch keine Fänge in der App registriert</p>`}</div>`).join("")}
   ${user?`<h3>Fang eintragen</h3>
   <form id="catchForm"><select name="species" aria-label="Fischart">${opts}</select>
     <input name="lure" placeholder="Köder, z. B. Gummifisch" maxlength="60">
     <input name="len" type="number" min="1" max="300" placeholder="Länge in cm (optional)">
     <button>Fang speichern</button><p class="err" id="catchErr"></p></form>
   <h3>Meldung zum Bestand</h3>
   <form id="repForm"><select name="species" aria-label="Fischart">${opts}</select>
     <select name="type" aria-label="Art der Meldung"><option value="besatz">Hier wurde Besatz eingebracht</option><option value="weg">Art kommt hier nicht mehr vor</option></select>
     <button class="ghost">Meldung senden</button><p class="err" id="repErr"></p></form>`
   :`<div class="note">Melde dich an, um Fänge einzutragen oder Meldungen abzugeben.</div>`}`;
  document.getElementById("back").onclick = ()=>{if(window.map){map.setCenter({lat:51.2,lng:10.4});map.setZoom(6)}home()};
  bindAuth();
  const cf = document.getElementById("catchForm");
  if(cf) cf.onsubmit = async e=>{
    e.preventDefault();
    const {error} = await sb.from("catches").insert({lake:id,species:cf.species.value,lure:cf.lure.value||null,length_cm:cf.len.value?+cf.len.value:null});
    if(error) document.getElementById("catchErr").textContent = error.message; else select(id);
  };
  const rf = document.getElementById("repForm");
  if(rf) rf.onsubmit = async e=>{
    e.preventDefault();
    const {error} = await sb.from("reports").insert({lake:id,species:rf.species.value,type:rf.type.value});
    if(error) document.getElementById("repErr").textContent = error.message; else select(id);
  };
}

/* ============ GOOGLE MAPS ============ */
window.initMap = function(){
  window.map = new google.maps.Map(document.getElementById("map"),{center:{lat:51.2,lng:10.4},zoom:6,mapTypeControl:false,streetViewControl:false});
  LAKES.forEach(l=>{
    const m = new google.maps.Marker({position:{lat:l.lat,lng:l.lng},map,title:l.name});
    m.addListener("click",()=>select(l.id));
  });
};
if(GMAPS_KEY){
  const s=document.createElement("script");
  s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(GMAPS_KEY)}&callback=initMap&loading=async`;
  s.async=true; document.head.appendChild(s);
} else {
  document.getElementById("map").innerHTML='<p class="mut" style="padding:24px">Karte erscheint, sobald ein Google-Maps-Key eingetragen ist.</p>';
}
if(!sb) home();
</script>
</body>
</html>
